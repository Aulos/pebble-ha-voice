<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 25 25" width="25" height="25" shape-rendering="crispEdges">
  <title>HA Voice</title>
  <desc>A house with a microphone inside: Home Assistant, by voice.</desc>
  <!-- The design is drawn on the 25 pixel grid the watch's app menu uses, with
       every edge on a whole pixel, so it stays sharp when it is rendered at 25
       pixels. Larger sizes are the same drawing scaled up. -->
  <rect width="25" height="25" fill="#000000"/>
  <g fill="none" stroke="#00aaff" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter">
    <polyline points="4,10 12.5,2 21,10"/>
  </g>
  <g fill="#00aaff">
    <rect x="4" y="10" width="2" height="11"/>
    <rect x="19" y="10" width="2" height="11"/>
    <rect x="4" y="21" width="17" height="1"/>
    <rect x="9" y="11" width="7" height="8" rx="2.5"/>
    <rect x="11" y="19" width="3" height="2"/>
    <rect x="9" y="20" width="7" height="1"/>
  </g>
  <g fill="#000000">
    <rect x="11" y="13" width="3" height="1"/>
    <rect x="11" y="15" width="3" height="1"/>
    <rect x="11" y="17" width="3" height="1"/>
  </g>
</svg>
